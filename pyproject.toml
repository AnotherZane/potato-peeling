[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "potato-peeling"
version = "0.1.0.dev0"
description = "The largest convex polygon inside a simple polygon: exact, meshed and approximate algorithms"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING.LESSER", "COPYING", "THIRD-PARTY-NOTICES.txt", "LICENSES/*.txt"]
authors = [
    { name = "Zane Dmitri Pereira", email = "zanedpereira2@gmail.com" },
]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/AnotherZane/potato-peeling"

[tool.scikit-build]
wheel.py-api = "cp312"
wheel.packages = ["python/potato_peeling"]
cmake.build-type = "Release"
# Install only our module, not the install rules of dependencies built from source (CDT).
install.components = ["python"]
build-dir = "build/{wheel_tag}"
# CGAL links GMP's C++ interface when it finds it; we do not use it, so wheels
# need not bundle libgmpxx.
cmake.define = { CGAL_WITH_GMPXX = "OFF" }
sdist.exclude = ["build/"]

[dependency-groups]
dev = ["pytest>=8", "numpy", "shapely"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# The slow tier runs with -m slow, or everything with -m "".
addopts = ["-m", "not slow"]
markers = ["slow: larger fixture polygons and the suboptimal optima (minutes)"]

[tool.cibuildwheel]
# 3.10 and 3.11 get their own wheels; the cp312 wheel is abi3 (wheel.py-api above),
# for 3.12 and later. Free-threaded and musllinux wheels come later.
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*"]
# The default test set, from the installed wheel: the tests and the pytest
# settings are copied, the package source is not.
test-sources = ["tests", "pyproject.toml"]
test-requires = ["pytest", "numpy", "shapely"]
test-command = "pytest tests/python"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash ci/install_deps.sh /opt/deps"
environment = { CMAKE_PREFIX_PATH = "/opt/deps" }

[tool.cibuildwheel.macos]
before-all = "bash ci/install_deps.sh /tmp/potato-peeling-deps"
environment = { CMAKE_PREFIX_PATH = "/tmp/potato-peeling-deps", MACOSX_DEPLOYMENT_TARGET = "11.0" }
