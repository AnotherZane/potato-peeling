# The npm packages: the native addon for each platform (@potato-peeling/<platform>,
# with GMP and MPFR beside it), each tested on every supported Node in the job that
# built it, and the main package (the TypeScript API).
#   - pull requests touching the addon or packaging, and manual runs: build and test;
#   - a v* tag (matching the version): also publish to npm, after approval on the npm
#     environment. The first release of each package uses the NPM_TOKEN secret (npm's
#     trusted publishing can only be set up for a package that exists); later ones,
#     with the secret removed, trusted publishing.
name: Node

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - js/**
      - bindings/node/**
      - CMakeLists.txt
      - ci/**
      - .github/workflows/node.yml

permissions:
  contents: read

defaults:
  run:
    # Git Bash on Windows
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 ci/check_version.py --tag "${{ github.ref_name }}"
          else
            python3 ci/check_version.py
          fi

  build:
    name: Addon (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Linux builds in the wheels' manylinux image, so the addon needs only glibc 2.28.
    container: ${{ matrix.container }}
    # a hang (a stalled download, a stuck build) fails here instead of after 6 hours;
    # win32-arm64 gets longer, as it builds GMP and MPFR with x64 MSYS2 tools under
    # emulation when they are not cached (about 50 minutes).
    timeout-minutes: ${{ matrix.platform == 'win32-arm64' && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            deps: /opt/deps
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            deps: /opt/deps
          - platform: darwin-arm64
            os: macos-15
            deps: /tmp/potato-peeling-deps
          - platform: darwin-x64
            os: macos-15-intel
            deps: /tmp/potato-peeling-deps
          - platform: win32-x64
            os: windows-latest
            deps: C:/deps
            vcpkg: x64-windows
          - platform: win32-arm64
            os: windows-11-arm
            deps: C:/deps
            vcpkg: arm64-windows
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      # macOS and Windows build GMP and MPFR from source (minutes): the same cache as
      # the wheels (same key), kept until the script or the vcpkg manifest changes.
      - if: runner.os != 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ matrix.deps }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/install_deps.sh', 'ci/vcpkg/vcpkg.json') }}
      - name: Dependencies
        run: bash ci/install_deps.sh "${{ matrix.deps }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        working-directory: js
        env:
          CMAKE_PREFIX_PATH: ${{ runner.os == 'Windows' && format('C:/deps;C:/deps/vcpkg/{0}', matrix.vcpkg) || matrix.deps }}
        run: |
          npm ci
          npm run build:native
      - name: Package
        run: |
          py=$(command -v python3 || command -v python)
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then extra=(--lib-dir "C:/deps/vcpkg/${{ matrix.vcpkg }}/bin"); fi
          "$py" ci/npm_package.py platform build/node/Release/potato_peeling.node build/npm "${extra[@]}"
          cd "build/npm/${{ matrix.platform }}" && npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: build/npm/${{ matrix.platform }}/*.tgz
      # The package installed from its tarball and the local build removed, so the
      # loader must use the packaged addon and its bundled libraries (on Linux inside
      # the manylinux container: the oldest glibc supported). node_modules does not
      # depend on the Node version, so each version only reruns the tests; each runs
      # even if an earlier one failed.
      - name: Install the package
        id: install
        working-directory: js
        run: |
          rm -rf ../build/node
          npm install --no-save ../build/npm/${{ matrix.platform }}/*.tgz
          node -p "require.resolve('@potato-peeling/${{ matrix.platform }}')"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Test on Node 20
        working-directory: js
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Test on Node 22
        working-directory: js
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Test on Node 24
        working-directory: js
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Test on Node 26
        working-directory: js
        run: npm test

  # musl Linux (Alpine): the same build, packing and tests, in the musllinux container
  # by docker run (ci/node_musl.sh), since GitHub's JavaScript actions do not run
  # reliably in Alpine job containers.
  musl:
    name: Addon (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-musl
            os: ubuntu-latest
            image: quay.io/pypa/musllinux_1_2_x86_64
          - platform: linux-arm64-musl
            os: ubuntu-24.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Build, package and test
        run: docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" bash ci/node_musl.sh
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: build/npm/${{ matrix.platform }}/*.tgz

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [version, build, musl]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm 11.5.1+ and Node 22.14+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: addons
          merge-multiple: true
      - name: Main package
        run: |
          (cd js && npm ci && npm run build)
          python3 ci/npm_package.py main build/npm
      # Every platform package first, so the main package never points at a missing one.
      # npm requires an explicit tag for a pre-release version; "latest", so that a
      # bare `npm install potato-peeling` installs the alpha while there is no release.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # ./ so npm reads a path: addons/x.tgz alone is GitHub shorthand (owner/repo).
          for f in addons/*.tgz; do npm publish "./$f" --access public --tag latest; done
          (cd build/npm/potato-peeling && npm publish --access public --tag latest)
