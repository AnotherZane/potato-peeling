# Build and test pushes to main and pull requests: the default C++ and Python test
# sets against system packages (wheels use pinned dependencies, see wheels.yml).
# Tags are not built here (a branch filter excludes them); wheels.yml tests a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # uv's own Python, which has the headers the extension builds against
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 ci/check_version.py

  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (latest)
            os: ubuntu-latest
            python: true
          # The oldest supported setup: CGAL 5.4, Boost 1.74, CMake 3.22. C++ only.
          - name: Ubuntu 22.04 (minimum versions)
            os: ubuntu-22.04
            python: false
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake libcgal-dev libboost-dev libgmp-dev libmpfr-dev
      - name: C++ build and tests
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci -j "$(nproc)"
          ctest --test-dir build/ci -LE slow --output-on-failure
      - if: matrix.python
        uses: astral-sh/setup-uv@v10.3.3
      - if: matrix.python
        name: Python tests
        run: |
          uv sync
          uv run pytest
      - if: matrix.python
        name: Type stub up to date
        run: bash ci/update_stub.sh --check

  # MSVC, against the pinned dependencies the Windows wheels use (vcpkg for GMP and
  # MPFR). C++ only: the Python package is tested through the wheels.
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: C:/deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/install_deps.sh', 'ci/vcpkg/vcpkg.json') }}
      - name: Dependencies
        run: bash ci/install_deps.sh C:/deps
      - name: C++ build and tests
        run: |
          cmake -S . -B build/ci -DCMAKE_PREFIX_PATH="C:/deps;C:/deps/vcpkg/x64-windows"
          cmake --build build/ci --config Release -j 4
          PATH="/c/deps/vcpkg/x64-windows/bin:$PATH" \
            ctest --test-dir build/ci -C Release -LE slow --output-on-failure

  macos:
    name: macOS (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: brew install cgal boost gmp mpfr
      - name: C++ build and tests
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci -j "$(sysctl -n hw.ncpu)"
          ctest --test-dir build/ci -LE slow --output-on-failure
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python tests
        run: |
          uv sync
          uv run pytest
